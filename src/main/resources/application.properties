# APPLICATION
spring.application.name=GOATSPORTS-WORKFLOW-SERVICE
spring.threads.virtual.enabled=true
server.port=${SERVER_PORT}
# CAMUNDA
camunda.client.mode=${CAMUNDA_CLIENT_MODE}
camunda.client.enabled=true
camunda.client.grpc-address=${CAMUNDA_CLIENT_ZEEBE_GRPCADDRESS}
camunda.client.rest-address=${CAMUNDA_CLIENT_ZEEBE_RESTADDRESS}
camunda.client.auth.connect-timeout=${CAMUNDA_CONNECT_TIMEOUT}
camunda.client.request-timeout=${CAMUNDA_REQUEST_TIMEOUT}
camunda.client.worker.defaults.request-timeout=${CAMUNDA_WORKER_REQUEST_TIMEOUT}
camunda.client.execution-threads=${CAMUNDA_EXECUTION_THREADS}
# SERVICE
auth.service.url=${AUTH_SERVICE_URL}
venue.service.url=${VENUE_SERVICE_URL}
notification.service.url=${NOTIFICATION_SERVICE_URL}
storage.service.url=${STORAGE_SERVICE_URL}
# EUREKA
eureka.client.enabled=${EUREKA_CLIENT_ENABLED}
spring.cloud.discovery.enabled=${EUREKA_DISCOVERY_ENABLED}
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL}
eureka.instance.prefer-ip-address=${EUREKA_SERVICE_PREFER_IP_ADDRESS}
# KAFKA
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=iuh.fit.workflowservice.infrastructure.external.kafka.event.FileMoveCompletedEvent
spring.kafka.topic.file-move-completed=${KAFKA_TOPIC_FILE_MOVE_COMPLETED}
spring.kafka.topic.user-log=${KAFKA_TOPIC_USER_LOG}
# JWT
app.jwt.secret=${JWT_SECRET}
# ACTUATOR
management.endpoints.web.exposure.include=health,info,prometheus
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.UP=200
management.endpoint.health.status.http-mapping.DOWN=503
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# LOGGING
logging.level.root=INFO
logging.level.me.minhdat=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
# SWAGGER
springdoc.api-docs.enabled=false
springdoc.api-docs.version=openapi_3_0
springdoc.swagger-ui.enabled=false
# JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh