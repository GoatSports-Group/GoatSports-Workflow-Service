# APPLICATION
spring.application.name=GOATSPORTS-WORKFLOW-SERVICE
spring.threads.virtual.enabled=true
server.port=${SERVER_PORT}
# CAMUNDA
camunda.client.mode=${CAMUNDA_CLIENT_MODE}
camunda.client.cloud.cluster-id=${CAMUNDA_CLUSTER_ID}
camunda.client.cloud.region=${CAMUNDA_CLUSTER_REGION}
camunda.client.auth.client-id=${CAMUNDA_CLIENT_ID}
camunda.client.auth.client-secret=${CAMUNDA_CLIENT_SECRET}
camunda.client.auth.connect-timeout=${CAMUNDA_CONNECT_TIMEOUT}
camunda.client.request-timeout=${CAMUNDA_REQUEST_TIMEOUT}
camunda.client.worker.defaults.request-timeout=${CAMUNDA_WORKER_REQUEST_TIMEOUT}
camunda.client.execution-threads=${CAMUNDA_EXECUTION_THREADS}
# EUREKA
eureka.client.enabled=${EUREKA_CLIENT_ENABLED}
spring.cloud.discovery.enabled=${EUREKA_DISCOVERY_ENABLED}
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL}
eureka.instance.prefer-ip-address=${EUREKA_SERVICE_PREFER_IP_ADDRESS}
# JWT
app.jwt.secret=${APP_JWT_SECRET}
# ACTUATOR
management.endpoints.web.exposure.include=health,info,prometheus
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.UP=200
management.endpoint.health.status.http-mapping.DOWN=503
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# LOGGING
logging.level.root=INFO
logging.level.me.minhdat=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
# SWAGGER
springdoc.api-docs.enabled=false
springdoc.api-docs.version=openapi_3_0
springdoc.swagger-ui.enabled=false
# JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh